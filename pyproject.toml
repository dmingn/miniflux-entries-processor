[project]
name = "miniflux-entries-processor"
dynamic = ["version"]
description = "A Python CLI tool that fetches entries from Miniflux and processes them based on rules defined in YAML."
authors = [
    { name = "dmingn", email = "dmingn@users.noreply.github.com" }
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "logzero>=1.7.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pydantic-yaml>=1.7.0",
    "requests>=2.32.0",
    "tenacity>=9.1.4",
    "todoist-api-python>=3.1.0",
    "typer>=0.26.8",
]

[project.scripts]
miniflux-entries-processor = "miniflux_entries_processor.__main__:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.12.0",
    "ruff>=0.15.20",
    "types-requests>=2.32.4.20250913",
]

[tool.mypy]
exclude_gitignore = true
strict = true
plugins = "pydantic.mypy"

[[tool.mypy.overrides]]
module = "logzero"
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D103", # tests do not require docstrings; the test name is the description.
    "FBT001", # boolean positional arguments are common in parametrized tests.
    "N802", # test function names may include PascalCase SUT names.
    "PLR2004", # magic numbers are acceptable in tests.
    "S101", # using bare `assert` is fine in tests.
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
