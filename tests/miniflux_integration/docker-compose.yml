services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: miniflux
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniflux -d miniflux"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  rss:
    image: nginx:1.29-alpine
    volumes:
      - ./fixtures/feed.xml:/usr/share/nginx/html/feed.xml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/feed.xml || exit 1",
        ]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s

  miniflux:
    image: miniflux/miniflux:2.3.4
    depends_on:
      db:
        condition: service_healthy
      rss:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MINIFLUX_HOST_PORT}:8080"
    environment:
      DATABASE_URL: postgres://miniflux:secret@db/miniflux?sslmode=disable
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    healthcheck:
      test: ["CMD", "/usr/bin/miniflux", "-healthcheck", "auto"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
